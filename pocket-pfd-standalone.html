<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style></head><body><title>Pocket PFD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one column, a cockpit-panel page with the instrument bezel on top and avionics-style controls below it. Deliberately single dark theme. */
:root{
  --panel:#14171b;
  --plate:#1d2126;
  --rim:#2c323a;
  --ink:#e7eaee;
  --muted:#8b949e;
  --cyan:#41d3e3;
  --magenta:#e040e0;
  --font:"Barlow", system-ui, -apple-system, sans-serif;
  --cond:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--panel);color:var(--ink)}
body{
  font-family:var(--font);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 28px;
}
.wrap{max-width:460px;margin:0 auto;display:grid;gap:14px}
header{display:grid;gap:2px}
h1{margin:0;font-family:var(--cond);font-weight:700;font-size:1.35rem;letter-spacing:.14em;text-transform:uppercase;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}

.bezel{
  background:linear-gradient(180deg,#24282e,#0d0e11);
  border-radius:16px;padding:10px 10px 6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -1px 0 rgba(0,0,0,.6), 0 12px 28px rgba(0,0,0,.45);
}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:1/1.06;border-radius:5px;overflow:hidden;background:#000}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{position:relative;z-index:1;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.bezel-foot{display:flex;justify-content:space-between;align-items:center;padding:4px 0 0 4px}
.bezel-foot .tools{display:flex;gap:2px;align-items:center}
.brand{font-family:var(--cond);font-weight:600;font-size:.72rem;letter-spacing:.22em;color:#6f7780;text-transform:uppercase}

.controls{display:grid;gap:12px;background:var(--plate);border:1px solid var(--rim);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-family:var(--cond);font-weight:600;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{
  font:600 .95rem/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);background:#262b31;border:1px solid #3a4149;border-radius:8px;
  min-height:40px;padding:0 14px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none
}
button:active{background:#30363d}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.seg{display:flex;flex:1;min-width:0}
.seg button{flex:1;border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button + button{border-left:0}
.seg button[aria-pressed="true"]{background:#0e3a41;border-color:var(--cyan);color:var(--cyan)}
#zero{flex:0 0 auto}

.power{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.val{font-family:var(--cond);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--cyan);min-width:3.2em;text-align:right}
input[type=range]{width:100%;accent-color:var(--cyan);min-height:32px}

.steppers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stepper{display:grid;gap:4px;justify-items:center;background:#171a1e;border:1px solid var(--rim);border-radius:10px;padding:8px 6px}
.stepper .val{min-width:0;text-align:center}
.stepper .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.stepper button{padding:0;min-height:36px;font-size:1.1rem}

.hint{margin:0;color:var(--muted);font-size:.88rem;line-height:1.45}
.msg{margin:0;font-size:.88rem;line-height:1.45;color:#f0c46a}
.msg:empty{display:none}

/* Options */
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:#171a1e;border:1px solid var(--rim);border-radius:10px;cursor:pointer}
.opt b{display:block;font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem}
.opt small{display:block;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:14px;background:#30363d;position:relative;margin:0;cursor:pointer;transition:background .15s}
.opt input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#c9cfd6;transition:transform .15s}
.opt input:checked{background:#0e7480}
.opt input:checked::after{transform:translateX(18px);background:#fff}
.dto{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;margin:0}
.dto input{min-width:0;width:100%;min-height:40px;padding:0 10px;font:700 1.05rem var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:#0f1114;border:1px solid #3a4149;border-radius:8px}
.dto-info{margin:0;color:var(--magenta);font-family:var(--cond);font-weight:600;font-size:.95rem;letter-spacing:.04em}
.dto-info:empty{display:none}
@media (prefers-reduced-motion: reduce){ .opt input, .opt input::after{transition:none} }

.fox{
  position:absolute;z-index:2;left:50%;bottom:24%;transform:translateX(-50%);
  min-height:44px;padding:0 20px;font-size:1.1rem;letter-spacing:.14em;
  background:#b91c1c;border:1px solid #fca5a5;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)
}
.fox:active{background:#991b1b}
.icon-btn{
  display:grid;place-items:center;width:40px;height:40px;min-height:0;padding:0;
  background:transparent;border:0;border-radius:8px;color:#9aa3ad
}
.icon-btn:active{background:rgba(255,255,255,.08);color:var(--ink)}
.page-btn{width:auto;padding:0 10px;font-size:.8rem;letter-spacing:.14em}
.fs-only{display:none!important}

/* Full screen: only the instrument, as large as the screen allows */
body.fs{overflow:hidden}
body.fs header, body.fs .controls, body.fs .bezel-foot{display:none}
body.fs .bezel{
  position:fixed;inset:0;z-index:50;border-radius:0;background:#000;box-shadow:none;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
body.fs .screen{
  border-radius:0;
  width:min(100%, calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 1.06));
}
body.fs .fs-only{
  display:grid!important;position:fixed;z-index:60;
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  background:rgba(12,14,17,.55);color:#e7eaee;opacity:.8
}
body.fs .fs-only[hidden]{display:none!important}
body.fs #fsExit{right:calc(env(safe-area-inset-right,0px) + 8px)}
body.fs #fsPage{left:calc(env(safe-area-inset-left,0px) + 8px)}

.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.placard{
  font-family:var(--cond);font-weight:600;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:#d9dde2;background:#0b0c0e;border:1px solid #4a515a;border-radius:3px;padding:5px 8px
}
.credit{margin:0;color:#6f7780;font-size:.75rem}
</style>

<div class="wrap">
  <header>
    <h1>Pocket PFD</h1>
    <p class="sub">A G5-inspired primary flight display with a simple flight model. Drag to fly, tilt your phone, or take it for a drive.</p>
  </header>

  <div class="bezel">
    <div class="screen" id="screen">
      <video id="cam" playsinline muted autoplay hidden></video>
      <canvas id="pfd" role="img" aria-label="Primary flight display showing attitude, airspeed, altitude, vertical speed and heading"></canvas>
      <button class="fox" id="fox" hidden>Fox 2</button>
    </div>
    <div class="bezel-foot">
      <span class="brand">Pocket PFD</span>
      <div class="tools">
        <button class="icon-btn page-btn" id="pageBtn" hidden>HSI</button>
        <button class="icon-btn" id="fsBtn" aria-label="Full screen" title="Full screen">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <button class="icon-btn page-btn fs-only" id="fsPage" hidden>HSI</button>
  <button class="icon-btn fs-only" id="fsExit" aria-label="Exit full screen" title="Exit full screen">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <section class="controls" aria-label="Controls">
    <div class="row">
      <div class="seg" role="group" aria-label="Control mode">
        <button id="modeDrag" aria-pressed="true">Drag</button>
        <button id="modeTilt" aria-pressed="false">Tilt</button>
        <button id="modeDrive" aria-pressed="false">Drive</button>
      </div>
      <button id="zero">Level</button>
    </div>
    <p class="hint" id="hint"></p>
    <p class="msg" id="msg" role="status"></p>

    <div class="row" id="unitsRow" hidden>
      <span class="lbl">Speed</span>
      <div class="seg" role="group" aria-label="Speed units">
        <button id="unitMph" aria-pressed="true">MPH</button>
        <button id="unitKt" aria-pressed="false">Knots</button>
      </div>
    </div>

    <div class="power" id="powerRow">
      <label class="lbl" for="power">Power</label>
      <input type="range" id="power" min="0" max="100" step="1" value="75">
      <span class="val" id="powerVal">75%</span>
    </div>

    <div class="steppers">
      <div class="stepper">
        <span class="lbl">Alt sel</span>
        <span class="val" id="selAltVal">3500</span>
        <div class="btns"><button id="altDn" aria-label="Selected altitude down 100 feet">−</button><button id="altUp" aria-label="Selected altitude up 100 feet">+</button></div>
      </div>
      <div class="stepper">
        <span class="lbl">Hdg bug</span>
        <span class="val" id="selHdgVal">230°</span>
        <div class="btns"><button id="hdgDn" aria-label="Heading bug left 5 degrees">−</button><button id="hdgUp" aria-label="Heading bug right 5 degrees">+</button></div>
      </div>
      <div class="stepper">
        <span class="lbl">Baro</span>
        <span class="val" id="baroVal">29.92</span>
        <div class="btns"><button id="baroDn" aria-label="Altimeter setting down">−</button><button id="baroUp" aria-label="Altimeter setting up">+</button></div>
      </div>
    </div>

    <span class="lbl">Options</span>
    <div class="options">
      <label class="opt" for="optCam">
        <span><b>Camera HUD</b><small>Live camera behind the symbology. In Tilt or Drive, the horizon lines up with the real one.</small></span>
        <input type="checkbox" role="switch" id="optCam">
      </label>
      <label class="opt" for="optVoice">
        <span><b>Voice callouts</b><small>Bank angle, altitude alerter, stall, and five hundred near your direct-to airport.</small></span>
        <input type="checkbox" role="switch" id="optVoice">
      </label>
      <label class="opt" for="optDto">
        <span><b>Direct-to</b><small>Adds an HSI page with a course to any US or UK airport. In Drag or Tilt you can fly the sim there.</small></span>
        <input type="checkbox" role="switch" id="optDto">
      </label>
      <form class="dto" id="dtoForm" hidden>
        <input id="wpt" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Airport, e.g. KFDK" maxlength="7" aria-label="Airport identifier">
        <button type="submit" id="wptGo">Go</button>
        <button type="button" id="wptNear">Nearest</button>
      </form>
      <p class="dto-info" id="dtoInfo"></p>
      <label class="opt" for="optG">
        <span><b>G-meter</b><small>Live and peak g. In Drive it plots sideways and fore-aft g; Reset clears the peak.</small></span>
        <input type="checkbox" role="switch" id="optG">
      </label>
      <label class="opt" for="optLock">
        <span><b>Target lock</b><small>Uses the camera to spot cats, dogs, cars, planes and more. Hold one in the circle for a lock, then Fox 2. Turns on the Camera HUD.</small></span>
        <input type="checkbox" role="switch" id="optLock">
      </label>
      <label class="opt" for="optLockSound" id="lockSoundRow" hidden>
        <span><b>Lock sounds</b><small>The seeker growl while tracking and the steady tone on lock.</small></span>
        <input type="checkbox" role="switch" id="optLockSound" checked>
      </label>
    </div>

    <div class="foot">
      <button id="reset">Reset</button>
      <span class="placard">Not approved for flight · For fun only</span>
    </div>
    <p class="credit">Airport data from OurAirports (public domain).</p>
  </section>
</div>

<script>
(() => {
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const wrap360 = d => ((d % 360) + 360) % 360;
  const wrap180 = d => { d = wrap360(d); return d > 180 ? d - 360 : d; };
  const pad3 = n => String(n).padStart(3, '0');
  const F = '"Barlow Semi Condensed", "Arial Narrow", sans-serif';
  const MAG = '#e040e0', CYAN = '#41d3e3';

  // ---------- state ----------
  const INIT = { V: 110, alt: 3500, hdg: 230, theta: 2, phi: 0, power: 0.75, selAlt: 3500, selHdg: 230, baro: 29.92 };
  const S = { lat: null, lon: null };
  const IN = { mode: 'drag', cmdTheta: 2, cmdPhi: 0, tiltTheta: 0, tiltPhi: 0, absTheta: 0, absPhi: 0, units: 'mph' };
  const OPT = { cam: false, voice: false, dto: false, gmeter: false, lock: false, lockSound: true, wpt: '' };
  const GM = { lat: 0, lon: 0, n: 1, peak: 0 };
  let page = 'pfd';
  // Drive-mode sensor state
  const DR = {};
  let dcal = null;
  function resetDrive() {
    Object.assign(DR, { aLat: 0, aLatSlow: 0, aLon: 0, pitch: 0, roll: 0, absPitch: 0, absRoll: 0, speed: null, track: null, alt: null, altAcc: null,
      compass: null, prevAlt: null, prevT: 0, vsRaw: 0, hdgSrc: '', haveFix: false, altInit: false, lat: null, lon: null, watch: DR.watch ?? null });
    dcal = null;
    Object.assign(S, { V: 0, theta: 0, phi: 0, vs: 0, vTrend: 0, slip: 0, rate: 0, stall: false, aoa: 0 });
    GM.peak = 0;
  }
  const isDrive = () => IN.mode === 'drive';
  function reset() {
    Object.assign(S, INIT, { slip: 0, vTrend: 0, vs: 0, aoa: 2, stall: false, rate: 0 });
    IN.cmdTheta = 2; IN.cmdPhi = 0;
    calib = null;
    GM.peak = 0;
    syncReadouts();
  }

  // ---------- flight model (toy, roughly a C172) ----------
  // Speeds in knots, accelerations in kt/s. Drag = parasite + induced; g = 19.06 kt/s.
  const A = 4.24, B = 0.000229, C = 4897, G = 19.06;
  function step(dt) {
    const tilt = IN.mode === 'tilt';
    const hud = tilt && OPT.cam;
    const tTheta = clamp(hud ? IN.absTheta : tilt ? IN.tiltTheta : IN.cmdTheta, -30, 30);
    const tPhi = clamp(hud ? IN.absPhi : tilt ? IN.tiltPhi : IN.cmdPhi, -80, 80);
    const k = 1 - Math.exp(-dt / (tilt ? 0.06 : 0.35));
    const prevPhi = S.phi;
    S.theta += (tTheta - S.theta) * k;
    S.phi += (tPhi - S.phi) * k;

    const rollRate = (S.phi - prevPhi) / dt;
    S.slip += (clamp(-rollRate * 0.6, -14, 14) - S.slip) * (1 - Math.exp(-dt / 0.4));

    const V = Math.max(S.V, 25);
    const n = Math.min(1 / Math.cos(S.phi * D2R), 4);
    S.aoa = Math.min(2 * (110 / V) ** 2 * n, 24);
    S.stall = S.aoa > 15;
    let gamma = S.theta - S.aoa;
    if (S.stall) gamma -= (S.aoa - 15) * 1.5;

    const accel = A * S.power - B * V * V - C * n * n / (V * V) - G * Math.sin(gamma * D2R);
    S.V = clamp(S.V + accel * dt, 25, 220);
    S.vTrend += (accel * 6 - S.vTrend) * (1 - Math.exp(-dt / 0.8));

    const vsTrue = V * Math.sin(gamma * D2R) * 101.27;
    S.alt = Math.max(0, S.alt + vsTrue * dt / 60);
    S.vs += ((S.alt > 0 ? vsTrue : 0) - S.vs) * (1 - Math.exp(-dt / 0.6));

    S.rate = 1091 * Math.tan(S.phi * D2R) / V; // deg/s
    S.hdg = wrap360(S.hdg + S.rate * dt);

    // move the sim aircraft over the ground once it has a position (Direct-to)
    if (S.lat != null) {
      const d = S.V * dt / 3600 / 60; // degrees of arc
      S.lat += d * Math.cos(S.hdg * D2R);
      S.lon += d * Math.sin(S.hdg * D2R) / Math.cos(S.lat * D2R);
    }

    GM.n += (n - GM.n) * (1 - Math.exp(-dt / 0.3));
    GM.peak = Math.max(GM.peak, GM.n);
  }

  // ---------- drive mode: real GPS + motion data ----------
  function stepDrive(dt) {
    const k = tau => 1 - Math.exp(-dt / tau);
    const hud = OPT.cam;
    S.theta += (clamp(hud ? DR.absPitch : DR.pitch, -30, 30) - S.theta) * k(0.4);
    // Turn bank: the bank a plane would need for the car's sideways acceleration, atan(a_lat / g).
    // With the camera on, the horizon shows the real horizon instead.
    const bank = hud ? DR.absRoll : DR.roll + Math.atan2(DR.aLat, 9.81) / D2R;
    S.phi += (clamp(bank, -60, 60) - S.phi) * k(0.25);
    S.slip += (clamp((DR.aLat - DR.aLatSlow) * 6, -14, 14) - S.slip) * k(0.15);

    const prevV = S.V;
    const target = DR.speed == null ? 0 : DR.speed * 1.94384; // m/s -> kt
    S.V += (target - S.V) * k(0.6);
    S.vTrend += ((S.V - prevV) / dt * 6 - S.vTrend) * k(1);

    if (DR.alt != null) {
      if (!DR.altInit) { S.alt = DR.alt; DR.altInit = true; }
      S.alt += (DR.alt - S.alt) * k(2);
    }
    S.vs += (DR.vsRaw - S.vs) * k(3);

    const mps = S.V / 1.94384;
    S.rate = mps > 3 ? DR.aLat / mps / D2R : 0;
    S.hdg = wrap360(S.hdg + S.rate * dt);
    if (DR.speed != null && DR.speed > 2.5 && DR.track != null) {
      S.hdg = wrap360(S.hdg + wrap180(DR.track - S.hdg) * k(0.8)); DR.hdgSrc = 'TRK';
    } else if (DR.compass != null) {
      S.hdg = wrap360(S.hdg + wrap180(DR.compass - S.hdg) * k(0.5)); DR.hdgSrc = 'MAG';
    } else DR.hdgSrc = '';

    if (DR.lat != null) { S.lat = DR.lat; S.lon = DR.lon; }

    GM.lat += (DR.aLat / 9.81 - GM.lat) * k(0.2);
    GM.lon += (DR.aLon / 9.81 - GM.lon) * k(0.2);
    GM.peak = Math.max(GM.peak, Math.hypot(GM.lat, GM.lon));
  }

  function onDriveMotion(e) {
    const ag = e.accelerationIncludingGravity, a = e.acceleration;
    if (!ag || ag.x == null || ag.y == null || ag.z == null) return;
    // Gravity on its own: the phone's motion processor separates out the car's acceleration for us.
    const hasA = !!(a && a.x != null && a.y != null && a.z != null);
    let gx = ag.x, gy = ag.y, gz = ag.z;
    if (hasA) { gx -= a.x; gy -= a.y; gz -= a.z; }
    const m = Math.hypot(gx, gy, gz);
    if (m < 1) return;
    if (!dcal) dcal = { s: gy / m < -0.2 ? -1 : 1 };
    const s = dcal.s;
    const ux = s * gx / m, uy = s * gy / m, uz = s * gz / m;
    if (!dcal.x) {
      // Lateral and forward axes with the zeroed "up" removed, so a tilted mount still reads true.
      let lx = 1 - ux * ux, ly = -ux * uy, lz = -ux * uz;
      const lm = Math.hypot(lx, ly, lz) || 1;
      dcal.x = [lx / lm, ly / lm, lz / lm];
      let fx = uz * ux, fy = uz * uy, fz = -1 + uz * uz;
      const fm = Math.hypot(fx, fy, fz) || 1;
      dcal.f = [fx / fm, fy / fm, fz / fm];
      dcal.th0 = Math.asin(clamp(-uz, -1, 1)) / D2R;
      dcal.ph0 = Math.atan2(-ux, uy) / D2R;
      dcal.f0 = s * (ag.x * dcal.x[0] + ag.y * dcal.x[1] + ag.z * dcal.x[2]);
    }
    const thAbs = Math.asin(clamp(-uz, -1, 1)) / D2R;
    const phAbs = Math.atan2(-ux, uy) / D2R;
    DR.absPitch += (thAbs - DR.absPitch) * 0.1;
    DR.absRoll += (phAbs - DR.absRoll) * 0.1;
    DR.pitch += (thAbs - dcal.th0 - DR.pitch) * 0.05;
    // Real roll (phone or car tilting) comes from gravity; turn bank comes from the car's own
    // sideways acceleration with gravity removed.
    const ph = hasA ? wrap180(phAbs - dcal.ph0) : 0;

  const cv = document.getElementById('pfd');
  const ctx = cv.getContext('2d');
  let W = 360, H = 380, dpr = 1, L = {};
  function layout() {
    const k = clamp(W / 360, 0.8, 1.4);
    const spdW = Math.round(W * 0.19), altW = Math.round(W * 0.2), vsiW = Math.round(W * 0.085);
    const altX = W - altW - vsiW;
    const freeW = altX - spdW;
    const tapeTop = H * 0.09, tapeBot = H * 0.8, hy0 = H * 0.87;
    L = { k, spdW, altW, vsiW, altX, freeW, tapeTop, tapeBot, hy0,
      mid: (tapeTop + tapeBot) / 2, th: tapeBot - tapeTop,
      cx: spdW + freeW / 2, cy: H * 0.44, ppd: H * 0.017,
      R: Math.min(freeW * 0.46, H * 0.3) };
  }
  const fs = n => Math.round(n * L.k);
  function resize() {
    const r = screen.getBoundingClientRect();
    W = r.width; H = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    layout();
  }
  new ResizeObserver(resize).observe(screen);
  resize();

  function draw() {
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    c.lineJoin = 'round';
    if (page === 'hsi') { drawHsi(c); return; }

    const hud = OPT.cam && !!camStream;
    const ppd = (hud && camPpd()) || L.ppd;

    // --- sky / ground (or the camera image) ---
    c.save();
    c.translate(L.cx, L.cy); c.rotate(-S.phi * D2R); c.translate(0, S.theta * ppd);
    const big = Math.max(W, H) * 2;
    if (!hud) {
      let g = c.createLinearGradient(0, -H, 0, 0);
      g.addColorStop(0, '#1b4ca8'); g.addColorStop(1, '#3a86e6');
      c.fillStyle = g; c.fillRect(-big, -big, big * 2, big);
      g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#8a5a2e'); g.addColorStop(1, '#55361a');
      c.fillStyle = g; c.fillRect(-big, 0, big * 2, big);
      c.fillStyle = '#fff'; c.fillRect(-big, -1, big * 2, 2);
    } else {
      c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(-big, -2.5, big * 2, 5);
      c.fillStyle = '#fff'; c.fillRect(-big, -1, big * 2, 2);
    }
    c.restore();

    if (hud) { c.shadowColor = 'rgba(0,0,0,.85)'; c.shadowBlur = 3; }

    // --- pitch ladder ---
    c.save();
    c.beginPath(); c.rect(L.spdW, L.tapeTop, L.freeW, L.hy0 - 30 - L.tapeTop); c.clip();
    c.translate(L.cx, L.cy); c.rotate(-S.phi * D2R); c.translate(0, S.theta * ppd);
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5;
    c.font = `600 ${fs(11)}px ${F}`; c.textBaseline = 'middle';
    for (let p = -90; p <= 90; p += 2.5) {
      if (p === 0 || Math.abs(p - S.theta) > 22) continue;
      const y = -p * ppd;
      const len = p % 10 === 0 ? L.freeW * 0.42 : p % 5 === 0 ? L.freeW * 0.2 : L.freeW * 0.09;
      c.beginPath(); c.moveTo(-len / 2, y); c.lineTo(len / 2, y); c.stroke();
      if (p % 10 === 0) {
        c.textAlign = 'right'; c.fillText(Math.abs(p), -len / 2 - 4, y);
        c.textAlign = 'left'; c.fillText(Math.abs(p), len / 2 + 4, y);
      }
    }
    c.restore();

    // --- bank scale (moves with horizon) ---
    c.save();
    c.translate(L.cx, L.cy); c.rotate(-S.phi * D2R);
    c.strokeStyle = '#fff'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, L.R, -150 * D2R, -30 * D2R); c.stroke();
    for (const a of [-60, -45, -30, -20, -10, 10, 20, 30, 45, 60]) {
      const len = Math.abs(a) === 30 || Math.abs(a) === 60 ? L.R * 0.17 : L.R * 0.09;
      const ang = (-90 + a) * D2R;
      c.beginPath();
      c.moveTo(Math.cos(ang) * L.R, Math.sin(ang) * L.R);
      c.lineTo(Math.cos(ang) * (L.R + len), Math.sin(ang) * (L.R + len));
      c.stroke();
    }
    c.beginPath(); c.moveTo(0, -L.R); c.lineTo(-7, -L.R - 11); c.lineTo(7, -L.R - 11); c.closePath(); c.stroke();
    c.restore();
    c.shadowBlur = 0; c.shadowColor = 'transparent';

    // fixed roll pointer + slip/skid bar
    const py = L.cy - L.R + 2;
    c.fillStyle = Math.abs(S.phi) > 60 ? '#facc15' : '#fff'; c.strokeStyle = '#000'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(L.cx, py); c.lineTo(L.cx - 8, py + 12); c.lineTo(L.cx + 8, py + 12); c.closePath(); c.fill(); c.stroke();
    const sx = L.cx + S.slip * 0.9;
    c.fillRect(sx - 9, py + 15, 18, 5); c.strokeRect(sx - 9, py + 15, 18, 5);

    // --- aircraft symbol ---
    c.save();
    c.translate(L.cx, L.cy);
    c.fillStyle = '#ffd21f'; c.strokeStyle = '#000'; c.lineWidth = 1.5;
    const w1 = L.freeW * 0.12, w2 = L.freeW * 0.36, t = 5;
    for (const s of [-1, 1]) {
      c.beginPath();
      c.moveTo(s * w1, -t / 2); c.lineTo(s * w2, -t / 2); c.lineTo(s * w2, t / 2);
      c.lineTo(s * (w1 + t), t / 2); c.lineTo(s * (w1 + t), t * 2.2); c.lineTo(s * w1, t * 2.2);
      c.closePath(); c.fill(); c.stroke();
    }
    c.fillRect(-3, -3, 6, 6); c.strokeRect(-3, -3, 6, 6);
    c.restore();

    if (S.stall && !isDrive()) {
      c.font = `700 ${fs(16)}px ${F}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      const sy = L.cy + L.R * 0.62, bw = fs(66), bh = fs(24);
      c.fillStyle = '#d61f1f'; c.fillRect(L.cx - bw / 2, sy - bh / 2, bw, bh);
      c.fillStyle = '#fff'; c.fillText('STALL', L.cx, sy + 1);
    }

    if (hud && OPT.lock && TL.model) drawTargets(c);
    if (OPT.gmeter) drawG(c);
    drawSpeed(c); drawAlt(c); drawVsi(c); drawHeading(c);
    if (OPT.dto && DTO) drawDtoTag(c);
  }

  function tapeBg(c, x, w) {
    c.fillStyle = 'rgba(8,10,14,.55)';
    c.fillRect(x, L.tapeTop, w, L.th);
  }

  function drawG(c) {
    const r = fs(24), x = L.spdW + r + fs(8), y = L.hy0 - fs(34) - r - fs(14);
    c.save();
    c.font = `600 ${fs(11)}px ${F}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    if (isDrive()) {
      c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.arc(x, y, r / 2, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.moveTo(x - r, y); c.lineTo(x + r, y); c.moveTo(x, y - r); c.lineTo(x, y + r); c.stroke();
      // peak ring
      const pr = clamp(GM.peak, 0, 1.2) * r;
      if (pr > 2) { c.strokeStyle = MAG; c.setLineDash([3, 3]); c.beginPath(); c.arc(x, y, pr, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
      // dot: right turn to the right, accelerating upward (outer ring = 1 g)
      const dx = clamp(GM.lat, -1.2, 1.2) * r, dy = -clamp(GM.lon, -1.2, 1.2) * r;
      c.fillStyle = '#ffd21f'; c.strokeStyle = '#000';
      c.beginPath(); c.arc(x + dx, y + dy, 4, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = '#fff';
      c.fillText(`${Math.hypot(GM.lat, GM.lon).toFixed(2)}G  MAX ${GM.peak.toFixed(2)}`, x + fs(10), y + r + fs(9));
    } else {
      const txt = `G ${GM.n.toFixed(1)}  MAX ${GM.peak.toFixed(1)}`;
      const tw = c.measureText(txt).width + 12;
      c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(L.spdW + 4, y + r - fs(8), tw, fs(18));
      c.fillStyle = GM.n > 2 ? '#facc15' : '#fff'; c.textAlign = 'left';
      c.fillText(txt, L.spdW + 10, y + r + 1);
    }
    c.restore();
  }

  function drawDtoTag(c) {
    const n = nav();
    const txt = n ? `${DTO.code} ${n.dist < 100 ? n.dist.toFixed(1) : Math.round(n.dist)}NM` : `${DTO.code} ----`;
    c.font = `600 ${fs(13)}px ${F}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    const x0 = L.spdW + fs(26) + 4, x1 = L.altX - 4;
    const tw = Math.min(c.measureText(txt).width + 12, x1 - x0);
    const cx = (x0 + x1) / 2;
    c.fillStyle = '#000'; c.fillRect(cx - tw / 2, 3, tw, L.tapeTop - 6);
    c.fillStyle = MAG; c.fillText(txt, cx, L.tapeTop / 2);
  }

  function drawSpeed(c) {
    const { spdW, tapeTop, th, mid } = L;
    const drive = isDrive();
    const uf = drive && IN.units === 'mph' ? 1.15078 : 1;
    const sv = S.V * uf;
    const kpp = th / 60, yV = v => mid - (v - sv) * kpp;
    c.save();
    c.beginPath(); c.rect(0, tapeTop, spdW, th); c.clip();
    tapeBg(c, 0, spdW);
    const band = (x, w, a, b, col) => { c.fillStyle = col; const y1 = yV(b), y2 = yV(a); c.fillRect(x, y1, w, y2 - y1); };
    const bx = spdW - 6;
    if (!drive) {
      band(bx, 6, 48, 129, '#22c55e');
      band(bx, 6, 129, 163, '#facc15');
      band(bx, 6, 163, 300, '#e11d1d');
      band(bx - 4, 3, 33, 85, '#fff');
    }
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5;
    c.font = `600 ${fs(13)}px ${F}`; c.textAlign = 'right'; c.textBaseline = 'middle';
    for (let v = Math.floor((sv - 35) / 5) * 5; v <= sv + 35; v += 5) {
      if (v < (drive ? 0 : 20)) continue;
      const y = yV(v), len = v % 10 === 0 ? 10 : 6;
      c.beginPath(); c.moveTo(bx - 4 - len, y); c.lineTo(bx - 4, y); c.stroke();
      if (v % 10 === 0) c.fillText(v, bx - 18, y);
    }
    // trend
    const tr = clamp(S.vTrend * uf, -30, 30);
    if (Math.abs(tr) > 1) { c.fillStyle = MAG; const y2 = yV(sv + tr); c.fillRect(spdW - 3, Math.min(mid, y2), 3, Math.abs(y2 - mid)); }
    c.restore();

    // readout
    const bh = fs(30);
    c.fillStyle = '#000'; c.strokeStyle = '#fff'; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(3, mid - bh / 2); c.lineTo(spdW - 12, mid - bh / 2); c.lineTo(spdW - 12, mid - 6);
    c.lineTo(spdW - 3, mid); c.lineTo(spdW - 12, mid + 6); c.lineTo(spdW - 12, mid + bh / 2); c.lineTo(3, mid + bh / 2);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = !drive && (S.V < 48 || S.stall) ? '#ff4a4a' : '#fff';
    c.font = `700 ${fs(21)}px ${F}`; c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(Math.round(sv), spdW - 15, mid + 1);

    // labels
    c.font = `600 ${fs(12)}px ${F}`; c.textAlign = 'left';
    c.fillStyle = '#000'; c.fillRect(0, (L.tapeBot + L.hy0) / 2 - fs(9), spdW + fs(12), fs(18));
    c.fillStyle = '#fff';
    if (drive) c.fillText(`GS ${IN.units === 'mph' ? 'MPH' : 'KT'}`, 4, (L.tapeBot + L.hy0) / 2);
    else c.fillText(`TAS ${Math.round(S.V * (1 + S.alt / 1000 * 0.02))}KT`, 4, (L.tapeBot + L.hy0) / 2);
    c.fillStyle = '#000'; c.fillRect(0, 3, spdW + fs(26), L.tapeTop - 6);
    c.fillStyle = CYAN; c.fillText(`HDG ${pad3(Math.round(S.selHdg) % 360)}°`, 5, L.tapeTop / 2);
  }

  function indAlt() { return S.alt + (S.baro - 29.92) * 1000; }

  function drawAlt(c) {
    const { altX, altW, tapeTop, tapeBot, th, mid } = L;
    const drive = isDrive();
    const noAlt = drive && !DR.altInit;
    const ia = drive ? S.alt : indAlt();
    const fpp = th / 600, yA = a => mid - (a - ia) * fpp;
    c.save();
    c.beginPath(); c.rect(altX, tapeTop, altW, th); c.clip();
    tapeBg(c, altX, altW);
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5;
    c.font = `600 ${fs(13)}px ${F}`; c.textAlign = 'left'; c.textBaseline = 'middle';
    for (let a = Math.floor((ia - 340) / 20) * 20; a <= ia + 340; a += 20) {
      const y = yA(a), major = a % 100 === 0;
      c.beginPath(); c.moveTo(altX, y); c.lineTo(altX + (major ? 12 : 6), y); c.stroke();
      if (major) c.fillText(a, altX + 16, y);
    }
    // trend
    const tr = clamp(S.vs * 0.1, -300, 300);
    if (Math.abs(tr) > 10) { c.fillStyle = MAG; const y2 = yA(ia + tr); c.fillRect(altX, Math.min(mid, y2), 3, Math.abs(y2 - mid)); }
    c.restore();

    // selected altitude bug
    const by = clamp(yA(S.selAlt), tapeTop + 7, tapeBot - 7);
    c.fillStyle = CYAN;
    c.beginPath();
    c.moveTo(altX, by - 9); c.lineTo(altX + 7, by - 9); c.lineTo(altX + 7, by + 9); c.lineTo(altX, by + 9);
    c.lineTo(altX, by + 4); c.lineTo(altX + 4, by); c.lineTo(altX, by - 4); c.closePath(); c.fill();

    // readout
    const bh = fs(30);
    c.fillStyle = '#000'; c.strokeStyle = '#fff'; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(altX + 3, mid); c.lineTo(altX + 11, mid - 6); c.lineTo(altX + 11, mid - bh / 2);
    c.lineTo(altX + altW - 2, mid - bh / 2); c.lineTo(altX + altW - 2, mid + bh / 2);
    c.lineTo(altX + 11, mid + bh / 2); c.lineTo(altX + 11, mid + 6); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.font = `700 ${fs(20)}px ${F}`; c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(noAlt ? '----' : Math.round(ia / 10) * 10, altX + altW - 6, mid + 1);

    // selected altitude + baro
    c.fillStyle = '#000'; c.fillRect(altX, 3, W - altX, tapeTop - 6);
    c.fillStyle = CYAN; c.font = `600 ${fs(15)}px ${F}`; c.textAlign = 'center';
    c.fillText(`${S.selAlt}FT`, altX + (W - altX) / 2, tapeTop / 2);
    c.font = `600 ${fs(12)}px ${F}`;
    const foot = !drive ? `${S.baro.toFixed(2)}IN`
      : noAlt ? 'NO GPS'
      : DR.altAcc != null ? `GPS ±${Math.round(DR.altAcc)}` : 'GPS';
    c.fillStyle = '#000'; c.fillRect(altX, (tapeBot + L.hy0) / 2 - fs(9), W - altX, fs(18));
    c.fillStyle = CYAN;
    c.fillText(foot, altX + (W - altX) / 2, (tapeBot + L.hy0) / 2);
  }

  function drawVsi(c) {
    const { vsiW, tapeTop, th, mid } = L;
    const vx = W - vsiW;
    c.fillStyle = 'rgba(8,10,14,.7)'; c.fillRect(vx, tapeTop, vsiW, th);
    const yS = v => mid - clamp(v, -2000, 2000) / 2000 * (th / 2 - 10);
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5;
    c.font = `600 ${fs(11)}px ${F}`; c.textAlign = 'left'; c.textBaseline = 'middle';
    for (let v = -2000; v <= 2000; v += 500) {
      const y = yS(v), major = v % 1000 === 0;
      c.beginPath(); c.moveTo(vx, y); c.lineTo(vx + (major ? 9 : 5), y); c.stroke();
      if (major && v !== 0) c.fillText(Math.abs(v / 1000), vx + 12, y);
    }
    const y = yS(S.vs);
    c.fillStyle = '#000'; c.strokeStyle = '#fff'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(vx + 1, y); c.lineTo(vx + 7, y - 8); c.lineTo(W - 1, y - 8); c.lineTo(W - 1, y + 8); c.lineTo(vx + 7, y + 8); c.closePath(); c.fill(); c.stroke();
    if (Math.abs(S.vs) >= 100) {
      c.fillStyle = '#fff'; c.font = `600 ${fs(10)}px ${F}`; c.textAlign = 'right';
      c.fillText(Math.round(Math.abs(S.vs) / 50) * 50, W - 3, y + 1);
    }
  }

  function drawHeading(c) {
    const hy = L.hy0;
    c.fillStyle = 'rgba(8,10,14,.75)'; c.fillRect(0, hy, W, H - hy);
    const dpp = W / 80, xH = d => W / 2 + (d - S.hdg) * dpp;
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5;
    c.textAlign = 'center'; c.textBaseline = 'top';
    for (let d = Math.floor((S.hdg - 45) / 5) * 5; d <= S.hdg + 45; d += 5) {
      const x = xH(d), ten = d % 10 === 0;
      c.beginPath(); c.moveTo(x, hy + 5); c.lineTo(x, hy + 5 + (ten ? 9 : 5)); c.stroke();
      if (ten) {
        const n = wrap360(d);
        const card = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' }[n];
        c.font = `${card || n % 30 === 0 ? 700 : 500} ${fs(card || n % 30 === 0 ? 14 : 11)}px ${F}`;
        c.fillText(card || String(n / 10), x, hy + 17);
      }
    }
    // turn rate trend + standard-rate marks
    c.fillStyle = '#fff';
    for (const s of [-1, 1]) c.fillRect(W / 2 + s * 18 * dpp - 1, hy, 2, 5);
    const tx = W / 2 + clamp(S.rate * 6, -40, 40) * dpp;
    c.fillStyle = MAG; c.fillRect(Math.min(W / 2, tx), hy, Math.abs(tx - W / 2), 3);

    // heading bug
    const bx = clamp(W / 2 + wrap180(S.selHdg - S.hdg) * dpp, 7, W - 7);
    c.fillStyle = CYAN;
    c.beginPath(); c.moveTo(bx - 7, hy); c.lineTo(bx - 7, hy + 8); c.lineTo(bx, hy + 4); c.lineTo(bx + 7, hy + 8); c.lineTo(bx + 7, hy); c.closePath(); c.fill();

    // bearing to the direct-to airport
    if (OPT.dto && DTO) {
      const n = nav();
      if (n) {
        const px = clamp(W / 2 + wrap180(n.brg - S.hdg) * dpp, 6, W - 6);
        c.fillStyle = MAG;
        c.beginPath(); c.moveTo(px, H - 3); c.lineTo(px - 6, H - 12); c.lineTo(px + 6, H - 12); c.closePath(); c.fill();
      }
    }

    // heading box
    const bw = fs(56), bh = fs(23), top = hy - bh - 4;
    c.fillStyle = '#000'; c.strokeStyle = '#fff'; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(W / 2 - bw / 2, top); c.lineTo(W / 2 + bw / 2, top); c.lineTo(W / 2 + bw / 2, top + bh);
    c.lineTo(W / 2 + 6, top + bh); c.lineTo(W / 2, top + bh + 6); c.lineTo(W / 2 - 6, top + bh); c.lineTo(W / 2 - bw / 2, top + bh);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.font = `700 ${fs(17)}px ${F}`; c.textBaseline = 'middle';
    let h = Math.round(S.hdg) % 360; if (h === 0) h = 360;
    c.fillText(pad3(h) + '°', W / 2, top + bh / 2 + 1);
    if (isDrive() && DR.hdgSrc) {
      c.font = `600 ${fs(11)}px ${F}`; c.textAlign = 'right';
      c.fillStyle = '#000'; const tw = c.measureText(DR.hdgSrc).width + 8;
      c.fillRect(W / 2 - bw / 2 - 4 - tw, top + 3, tw, bh - 6);
      c.fillStyle = '#fff'; c.fillText(DR.hdgSrc, W / 2 - bw / 2 - 8, top + bh / 2 + 1);
    }
  }

  // ---------- HSI page ----------
  function drawHsi(c) {
    c.fillStyle = '#05070a'; c.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H * 0.53, r = Math.min(W * 0.4, H * 0.35);
    const n = OPT.dto && DTO ? nav() : null;
    const drive = isDrive();
    const fullScale = n && n.dist < 30 ? 1 : 2; // NM, TERM or ENR
    const dot = r * 0.2;

    // compass rose (rotates with heading)
    c.save();
    c.translate(cx, cy); c.rotate(-S.hdg * D2R);
    c.fillStyle = 'rgba(255,255,255,.04)'; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let d = 0; d < 360; d += 5) {
      const a = d * D2R, long = d % 10 === 0, r2 = r - (long ? r * 0.09 : r * 0.05);
      c.beginPath(); c.moveTo(Math.sin(a) * r, -Math.cos(a) * r); c.lineTo(Math.sin(a) * r2, -Math.cos(a) * r2); c.stroke();
      if (d % 30 === 0) {
        const card = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' }[d];
        c.save();
        c.translate(Math.sin(a) * r * 0.78, -Math.cos(a) * r * 0.78); c.rotate(a);
        c.font = `${card ? 700 : 600} ${fs(card ? 18 : 14)}px ${F}`;
        c.fillText(card || String(d / 10), 0, 0);
        c.restore();
      }
    }
    // heading bug
    c.save(); c.rotate(S.selHdg * D2R);
    c.fillStyle = CYAN;
    c.beginPath(); c.moveTo(-9, -r - 7); c.lineTo(9, -r - 7); c.lineTo(9, -r); c.lineTo(4, -r); c.lineTo(0, -r - 4); c.lineTo(-4, -r); c.lineTo(-9, -r); c.closePath(); c.fill();
    c.restore();

    if (n) {
      // bearing pointer to the airport (cyan, thin)
      c.save(); c.rotate(n.brg * D2R);
      c.strokeStyle = CYAN; c.fillStyle = CYAN; c.lineWidth = 2;
      c.beginPath(); c.moveTo(0, -r * 0.97); c.lineTo(0, -r * 0.62); c.moveTo(0, r * 0.62); c.lineTo(0, r * 0.97); c.stroke();
      c.beginPath(); c.moveTo(0, -r * 0.97); c.lineTo(-6, -r * 0.86); c.lineTo(6, -r * 0.86); c.closePath(); c.fill();
      c.restore();

      // course pointer + CDI (magenta)
      c.save(); c.rotate(DTO.dtk * D2R);
      c.strokeStyle = MAG; c.fillStyle = MAG; c.lineWidth = 4; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, -r * 0.84); c.lineTo(0, -r * 0.5); c.moveTo(0, r * 0.5); c.lineTo(0, r * 0.88); c.stroke();
      c.beginPath(); c.moveTo(0, -r * 0.95); c.lineTo(-9, -r * 0.8); c.lineTo(9, -r * 0.8); c.closePath(); c.fill();
      // dots
      c.fillStyle = 'none'; c.strokeStyle = '#fff'; c.lineWidth = 1.5;
      for (const k of [-2, -1, 1, 2]) { c.beginPath(); c.arc(k * dot, 0, 3.5, 0, Math.PI * 2); c.stroke(); }
      // deviation bar: if you are right of course, the bar sits left
      const dev = -clamp(n.xtk / fullScale, -1.2, 1.2) * 2 * dot;
      c.strokeStyle = MAG; c.lineWidth = 4;
      c.beginPath(); c.moveTo(dev, -r * 0.45); c.lineTo(dev, r * 0.45); c.stroke();
      // TO / FROM
      c.fillStyle = '#fff';
      c.beginPath();
      if (n.to) { c.moveTo(dot * 0.9, -r * 0.3); c.lineTo(dot * 0.9 - 7, -r * 0.3 + 10); c.lineTo(dot * 0.9 + 7, -r * 0.3 + 10); }
      else { c.moveTo(dot * 0.9, r * 0.3); c.lineTo(dot * 0.9 - 7, r * 0.3 - 10); c.lineTo(dot * 0.9 + 7, r * 0.3 - 10); }
      c.closePath(); c.fill();
      c.restore();
    }
    c.restore();

    // turn rate arc on the rim
    const tr = clamp(S.rate * 6, -40, 40);
    if (Math.abs(tr) > 0.5) {
      c.strokeStyle = MAG; c.lineWidth = 3;
      c.beginPath(); c.arc(cx, cy, r + 4, -90 * D2R + Math.min(0, tr) * D2R, -90 * D2R + Math.max(0, tr) * D2R); c.stroke();
    }

    // airplane symbol + lubber
    c.save(); c.translate(cx, cy);
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, -14); c.lineTo(0, 14);
    c.moveTo(-14, -1); c.lineTo(14, -1);
    c.moveTo(-6, 12); c.lineTo(6, 12);
    c.stroke();
    c.restore();
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(cx, cy - r + 2); c.lineTo(cx - 7, cy - r - 9); c.lineTo(cx + 7, cy - r - 9); c.closePath(); c.fill();

    // heading box
    const bw = fs(56), bh = fs(24), top = cy - r - 12 - bh;
    c.fillStyle = '#000'; c.strokeStyle = '#fff'; c.lineWidth = 1.5;
    c.fillRect(cx - bw / 2, top, bw, bh); c.strokeRect(cx - bw / 2, top, bw, bh);
    c.fillStyle = '#fff'; c.font = `700 ${fs(18)}px ${F}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    let h = Math.round(S.hdg) % 360; if (h === 0) h = 360;
    c.fillText(pad3(h) + '°', cx, top + bh / 2 + 1);

    // data fields
    const uf = drive && IN.units === 'mph' ? 1.15078 : 1;
    const pad = fs(8), yTop = fs(16), yBot = H - fs(14);
    c.font = `600 ${fs(13)}px ${F}`; c.textBaseline = 'middle';
    c.textAlign = 'left'; c.fillStyle = '#fff';
    c.fillText(`GS ${Math.round(S.V * uf)}${drive && IN.units === 'mph' ? 'MPH' : 'KT'}`, pad, yTop);
    c.fillStyle = CYAN;
    c.fillText(`HDG ${pad3(Math.round(S.selHdg) % 360)}°`, pad, yTop + fs(18));
    if (n) {
      c.textAlign = 'right'; c.fillStyle = MAG; c.font = `700 ${fs(15)}px ${F}`;
      c.fillText(DTO.code, W - pad, yTop);
      c.font = `600 ${fs(13)}px ${F}`;
      c.fillText(`${n.dist < 100 ? n.dist.toFixed(1) : Math.round(n.dist)}NM`, W - pad, yTop + fs(18));
      c.textAlign = 'left';
      c.fillText(`DTK ${pad3(Math.round(DTO.dtk) % 360)}°`, pad, yBot);
      c.fillStyle = '#fff';
      c.fillText(fullScale === 1 ? 'TERM' : 'ENR', pad, yBot - fs(18));
      c.textAlign = 'right';
      const gs = Math.max(S.V, 1), hrs = n.dist / gs;
      const ete = S.V < 3 ? '--:--' : hrs >= 1 ? `${Math.floor(hrs)}:${String(Math.round(hrs % 1 * 60)).padStart(2, '0')}` : `${Math.floor(hrs * 60)}:${String(Math.round(hrs * 3600 % 60)).padStart(2, '0')}`;
      c.fillText(`ETE ${ete}`, W - pad, yBot);
      c.fillText(`BRG ${pad3(Math.round(n.brg) % 360)}°`, W - pad, yBot - fs(18));
    } else {
      c.textAlign = 'center'; c.fillStyle = '#9aa3ad'; c.font = `600 ${fs(13)}px ${F}`;
      c.fillText(OPT.dto ? (DTO ? 'WAITING FOR POSITION' : 'NO WAYPOINT') : 'DIRECT-TO OFF', cx, yBot);
    }
  }

  // ---------- loop ----------
  let lastT = performance.now();
  function frame(t) {
    const dt = clamp((t - lastT) / 1000, 0.001, 0.05);
    lastT = t;
    if (isDrive()) stepDrive(dt); else step(dt);
    if (OPT.voice) callouts();
    if (OPT.lock && TL.model && camStream && page === 'pfd') { runDetect(t); updateLock(dt); }
    else if (TL.cand || TL.osc) { TL.cand = null; TL.locked = null; TL.lockT = 0; setTone('off'); $('fox').hidden = true; }
    if (TL.shot) TL.shot.t += dt;
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- drag input ----------
  let last = null, lastTap = 0;
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    last = { x: e.clientX, y: e.clientY };
    const now = performance.now();
    if (now - lastTap < 300 && IN.mode === 'drag') level();
    lastTap = now;
  });
  cv.addEventListener('pointermove', e => {
    if (!last || IN.mode !== 'drag') return;
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
    IN.cmdPhi = clamp(IN.cmdPhi + dx * 0.3, -60, 60);
    IN.cmdTheta = clamp(IN.cmdTheta + dy * 0.1, -20, 25);
  });
  ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { last = null; }));
  window.addEventListener('keydown', e => {
    if (IN.mode !== 'drag' || e.target.tagName === 'INPUT') return;
    const m = { ArrowLeft: [0, -3], ArrowRight: [0, 3], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (!m) return;
    e.preventDefault();
    IN.cmdTheta = clamp(IN.cmdTheta + m[0], -20, 25);
    IN.cmdPhi = clamp(IN.cmdPhi + m[1], -60, 60);
  });
  function level() { IN.cmdPhi = 0; IN.cmdTheta = Math.round(S.aoa); }

  // ---------- tilt input ----------
  let calib = null, gotMotion = false, wakeLock = null;
  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null || a.z == null) return;
    const m = Math.hypot(a.x, a.y, a.z);
    if (m < 1) return;
    gotMotion = true;
    if (IN.mode !== 'tilt') setMode('tilt');
    let nx = a.x / m, ny = a.y / m, nz = a.z / m;
    if (!calib) calib = { s: ny < -0.2 ? -1 : 1 };
    const ux = nx * calib.s, uy = ny * calib.s, uz = nz * calib.s;
    const th = Math.asin(clamp(-uz, -1, 1)) / D2R;
    const ph = Math.atan2(-ux, uy) / D2R;
    if (calib.th0 == null) { calib.th0 = th; calib.ph0 = ph; }
    const tTh = th - calib.th0, tPh = wrap180(ph - calib.ph0);
    IN.tiltTheta += (tTh - IN.tiltTheta) * 0.25;
    IN.tiltPhi += (tPh - IN.tiltPhi) * 0.25;
    IN.absTheta += (th - IN.absTheta) * 0.25;
    IN.absPhi += (wrap180(ph - IN.absPhi) ) * 0.25;
  }
  async function startTilt() {
    setMsg('Asking for motion access…');
    if (typeof DeviceMotionEvent === 'undefined') return tiltFail();
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r !== 'granted') return tiltFail('Motion access was declined, so you\'re flying by drag.');
      }
    } catch (err) { return tiltFail(); }
    calib = null; gotMotion = false;
    window.addEventListener('devicemotion', onMotion);
    setTimeout(() => {
      if (!gotMotion) { window.removeEventListener('devicemotion', onMotion); tiltFail(); }
      else setMsg('');
    }, 1500);
  }
  function tiltFail(text) {
    setMode('drag');
    setMsg(text || 'Motion sensors aren\'t available in this view, so you\'re flying by drag. Open the standalone copy on your iPhone (served over HTTPS) to fly by tilting.');
  }
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { wakeLock = null; }
  }

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  const msg = $('msg'), hint = $('hint');
  function setMsg(t) { msg.textContent = t; }
  function setMode(m) {
    const prev = IN.mode;
    IN.mode = m;
    if (prev === 'drive' && m !== 'drive') { stopDrive(); reset(); }
    if (m !== 'tilt') window.removeEventListener('devicemotion', onMotion);
    $('modeDrag').setAttribute('aria-pressed', m === 'drag');
    $('modeTilt').setAttribute('aria-pressed', m === 'tilt');
    $('modeDrive').setAttribute('aria-pressed', m === 'drive');
    $('zero').textContent = m === 'drag' ? 'Level' : 'Zero';
    $('unitsRow').hidden = m !== 'drive';
    $('powerRow').hidden = m === 'drive';
    cv.style.cursor = m === 'drag' ? 'grab' : 'default';
    hint.textContent = m === 'tilt'
      ? 'Hold the phone upright like the instrument and tap Zero. Rotate it like a yoke to bank; tilt the top toward you to pitch up. Lock portrait orientation first.'
      : m === 'drive'
      ? 'Mount the phone upright facing you, then tap Zero while stopped or driving straight on level road. Speed, track and altitude come from GPS, and turns show as the bank a plane would need. Passengers only.'
      : 'Drag on the display: sideways to bank, down to pitch up. Double-tap to level the wings. Arrow keys work too.';
    if (m === 'drag') {
      IN.cmdTheta = S.theta; IN.cmdPhi = S.phi;
    } else keepAwake();
  }
  $('modeDrag').addEventListener('click', () => { setMode('drag'); setMsg(''); });
  $('modeTilt').addEventListener('click', () => { if (IN.mode !== 'tilt') startTilt(); });
  $('modeDrive').addEventListener('click', () => { if (IN.mode !== 'drive') startDrive(); });
  $('zero').addEventListener('click', () => {
    if (IN.mode === 'tilt') calib = null;
    else if (IN.mode === 'drive') { dcal = null; DR.pitch = 0; DR.roll = 0; DR.aLat = 0; DR.aLatSlow = 0; DR.aLon = 0; }
    else level();
  });
  const setUnits = u => {
    IN.units = u;
    $('unitMph').setAttribute('aria-pressed', u === 'mph');
    $('unitKt').setAttribute('aria-pressed', u === 'kt');
  };
  $('unitMph').addEventListener('click', () => setUnits('mph'));
  $('unitKt').addEventListener('click', () => setUnits('kt'));

  // Full screen: iPhone Safari only allows true full screen for video, so the page fills the
  // window itself; where the browser supports it (iPad, Android, desktop) it also goes native.
  function enterFs() {
    document.body.classList.add('fs');
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    $('fsExit').focus();
  }
  function exitFs() {
    document.body.classList.remove('fs');
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) { const ex = document.exitFullscreen || document.webkitExitFullscreen; try { const p = ex.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    $('fsBtn').focus();
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) document.body.classList.remove('fs');
  }));
  $('fsBtn').addEventListener('click', enterFs);
  $('fsExit').addEventListener('click', exitFs);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('fs')) exitFs(); });

  // PFD / HSI page
  function syncPage() {
    if (!OPT.dto) page = 'pfd';
    const label = page === 'pfd' ? 'HSI' : 'PFD';
    for (const id of ['pageBtn', 'fsPage']) {
      const b = $(id);
      b.hidden = !OPT.dto; b.textContent = label;
      b.setAttribute('aria-label', `Show ${label} page`);
    }
  }
  const flipPage = () => { page = page === 'pfd' ? 'hsi' : 'pfd'; syncPage(); };
  $('pageBtn').addEventListener('click', flipPage);
  $('fsPage').addEventListener('click', flipPage);

  $('reset').addEventListener('click', () => { if (isDrive()) resetDrive(); else reset(); });

  const power = $('power');
  power.addEventListener('input', () => { S.power = power.value / 100; syncReadouts(); });

  function hold(btn, fn) {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault(); fn(); syncReadouts();
      t1 = setTimeout(() => { t2 = setInterval(() => { fn(); syncReadouts(); }, 80); }, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); syncReadouts(); } });
  }
  hold($('altDn'), () => { S.selAlt = clamp(S.selAlt - 100, 0, 18000); });
  hold($('altUp'), () => { S.selAlt = clamp(S.selAlt + 100, 0, 18000); });
  hold($('hdgDn'), () => { S.selHdg = wrap360(S.selHdg - 5); });
  hold($('hdgUp'), () => { S.selHdg = wrap360(S.selHdg + 5); });
  hold($('baroDn'), () => { S.baro = Math.round(clamp(S.baro - 0.01, 28.5, 31) * 100) / 100; });
  hold($('baroUp'), () => { S.baro = Math.round(clamp(S.baro + 0.01, 28.5, 31) * 100) / 100; });

  function syncReadouts() {
    $('powerVal').textContent = Math.round(S.power * 100) + '%';
    power.value = Math.round(S.power * 100);
    $('selAltVal').textContent = S.selAlt;
    let h = Math.round(S.selHdg) % 360; if (h === 0) h = 360;
    $('selHdgVal').textContent = pad3(h) + '°';
    $('baroVal').textContent = S.baro.toFixed(2);
  }

  // ---------- options ----------
  const KEY = 'pocketpfd.options';
  function saveOpts() { try { localStorage.setItem(KEY, JSON.stringify(OPT)); } catch (e) {} }
  function loadOpts() { try { Object.assign(OPT, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {} }

  $('optCam').addEventListener('change', async e => {
    if (e.target.checked) {
      const ok = await startCam();
      OPT.cam = ok; e.target.checked = ok;
    } else {
      stopCam(); OPT.cam = false;
      if (OPT.lock) { OPT.lock = false; $('optLock').checked = false; $('lockSoundRow').hidden = true; stopLock(); }
    }
    saveOpts();
  });
  $('optLock').addEventListener('change', async e => {
    OPT.lock = e.target.checked;
    if (OPT.lock) {
      unlockAudio();
      if (!camStream) {
        const ok = await startCam();
        OPT.cam = ok; $('optCam').checked = ok;
        if (!ok) { OPT.lock = false; e.target.checked = false; saveOpts(); return; }
      }
      setMsg('Loading target recognition (a few MB, first time only)…');
      try {
        await loadModel();
        setMsg('Target lock ready. Get something in the circle and hold it there.');
      } catch (err) {
        setMsg('Couldn\'t load target recognition. Check your connection and try again.');
        OPT.lock = false; e.target.checked = false;
      }
    } else stopLock();
    $('lockSoundRow').hidden = !OPT.lock;
    saveOpts();
  });
  $('optLockSound').addEventListener('change', e => {
    OPT.lockSound = e.target.checked;
    if (OPT.lockSound) unlockAudio(); else { setTone('off'); try { speechSynthesis.cancel(); } catch (err) {} }
    saveOpts();
  });
  $('fox').addEventListener('click', fire);
  $('optVoice').addEventListener('change', e => {
    OPT.voice = e.target.checked;
    if (OPT.voice) { unlockAudio(); say('Callouts on', 'test', 0); }
    else try { speechSynthesis.cancel(); } catch (err) {}
    saveOpts();
  });
  $('optDto').addEventListener('change', e => {
    OPT.dto = e.target.checked;
    $('dtoForm').hidden = !OPT.dto;
    if (OPT.dto) loadAirports().catch(() => setMsg('Couldn\'t load the airport list. Check your connection and try again.'));
    else { page = 'pfd'; }
    syncPage(); updateDtoInfo(); saveOpts();
  });
  $('optG').addEventListener('change', e => { OPT.gmeter = e.target.checked; GM.peak = 0; saveOpts(); });
  $('dtoForm').addEventListener('submit', e => { e.preventDefault(); $('wpt').blur(); goTo($('wpt').value); });
  $('wptNear').addEventListener('click', goNearest);

  function applyOpts() {
    $('optVoice').checked = OPT.voice;
    $('optDto').checked = OPT.dto;
    $('optG').checked = OPT.gmeter;
    $('dtoForm').hidden = !OPT.dto;
    if (OPT.voice) {
      // audio needs a tap before it can play
      const unlock = () => { unlockAudio(); window.removeEventListener('pointerdown', unlock); };
      window.addEventListener('pointerdown', unlock);
    }
    if (OPT.dto) {
      if (OPT.wpt) $('wpt').value = OPT.wpt;
      loadAirports().then(() => {
        const entry = OPT.wpt && APidx.get(OPT.wpt);
        if (entry) DTO = { code: OPT.wpt, name: entry[1], lat: entry[2], lon: entry[3], elev: entry[4] || 0, olat: null, olon: null, dtk: 0 };
        updateDtoInfo();
      }).catch(() => {});
    }
    $('optLock').checked = OPT.lock && OPT.cam;
    if (!OPT.cam) OPT.lock = false;
    $('optLockSound').checked = OPT.lockSound !== false;
    $('lockSoundRow').hidden = !OPT.lock;
    if (OPT.cam) startCam().then(ok => {
      OPT.cam = ok; $('optCam').checked = ok;
      if (!ok) { OPT.lock = false; $('optLock').checked = false; $('lockSoundRow').hidden = true; saveOpts(); return; }
      if (OPT.lock) {
        // the growl needs a tap before audio can play
        const unlock = () => { unlockAudio(); window.removeEventListener('pointerdown', unlock); };
        window.addEventListener('pointerdown', unlock);
        loadModel().catch(() => { OPT.lock = false; $('optLock').checked = false; });
      }
    });
    syncPage();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && IN.mode !== 'drag') keepAwake();
  });

  loadOpts();
  reset();
  setMode('drag');
  applyOpts();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
})();
</script>
</body></html>
